spring.application.name=MNP

# --- Datasource ---------------------------------------------------------
# Local defaults so `mvn spring-boot:run` works against a MySQL on localhost;
# docker-compose.yml overrides all of these via env vars for the container.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mnp}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:tpch_user}
spring.datasource.password=${DB_PASSWORD:2003}

# --- JPA ------------------------------------------------------------------
# The schema is owned by db/init.sql, not Hibernate: "validate" fails fast on drift
# between entities and the real tables instead of silently patching them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Porting request rules (Data section of the spec) ----------------------
mnp.porting.request-timeout=PT2M
mnp.porting.timeout-check-interval=PT30S
