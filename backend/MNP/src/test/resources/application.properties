# Test-only overrides so `mvn test` can load the Spring context without a real MySQL
# instance running. The real schema (db/init.sql) is still what runs in Docker/production;
# this just lets Hibernate generate an equivalent one in-memory for the context-load test.
spring.datasource.url=jdbc:h2:mem:mnp;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# This file replaces application.properties for tests rather than merging with it,
# so anything the app needs at startup has to be repeated here too.
mnp.porting.request-timeout=PT2M
mnp.porting.timeout-check-interval=PT30S
