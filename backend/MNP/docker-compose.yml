services:
  mysql:
    image: mysql:8.4
    container_name: mnp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mnp
      MYSQL_USER: mnp
      MYSQL_PASSWORD: mnp
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Published on 3307, not 3306: app<->mysql traffic stays on the internal
      # compose network regardless, and 3306 is often already taken by a local
      # MySQL install on the host. Connect a local client to localhost:3307 if needed.
      - "3307:3306"
    volumes:
      - mnp-mysql-data:/var/lib/mysql
      # Auto-run once against the `mnp` database on first container start.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: mnp-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: mnp
      DB_USERNAME: mnp
      DB_PASSWORD: mnp
    ports:
      - "8080:8080"

  frontend:
    build: ../../frontend
    container_name: mnp-frontend
    restart: unless-stopped
    ports:
      # Published on 4200 to match the backend's CORS allowlist
      # (WebConfig.addCorsMappings), whether served by `ng serve` or here.
      - "4200:80"

volumes:
  mnp-mysql-data:
