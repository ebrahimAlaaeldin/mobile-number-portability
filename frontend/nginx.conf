# The Angular router uses HTML5 pushState (routes like /requests, /new,
# /lookup), so nginx has to fall back to index.html for any path it doesn't
# recognize as a real file — otherwise a refresh on those routes 404s.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
